<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>m_pawa loan</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #2e7d32; margin-bottom: 5px; }
        p { color: #555; font-size: 14px; }
        .btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>m_pawa loan</h2>
        <p>Your Trusted Financial Partner</p>
        <hr style="border: 0.5px solid #eee;">
        <p>Welcome to the m_pawa dashboard.</p>
        <button class="btn" onclick="tgClose()">Close App</button>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function tgClose() {
            tg.close();
        }
    </script>
</body>
</html>
